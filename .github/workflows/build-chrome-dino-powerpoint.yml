name: Build Chrome Dino PowerPoint package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: pip install pillow python-pptx
      - name: Build PowerPoint package
        run: python powerpoint/build_package.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Chrome-Dino-PowerPoint
          path: powerpoint/dist/Chrome_Dino_PowerPoint_Pacote.zip
          if-no-files-found: error
