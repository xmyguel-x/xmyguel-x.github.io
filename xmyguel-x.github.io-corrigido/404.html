<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>DinoMod</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// GitHub Pages não tem fallback de rotas: guarda o caminho pedido e volta para a raiz,
// onde o index.html restaura a URL antes do app iniciar (rotas como /batalha).
try { sessionStorage.setItem("dinomod:redirect", (location.pathname.replace(/\/+$/, "") || "/") + location.search + location.hash); } catch (e) {}
location.replace("/");
</script></head>
