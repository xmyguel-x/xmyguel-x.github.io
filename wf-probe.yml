name: Publica os binarios da v1.1.0

# Fluxo temporario de publicacao: os arquivos binarios (sprites, icones e
# screenshots) chegam como base64 em .b64/ porque a API do GitHub so aceita
# texto UTF-8. Este workflow os reconstroi, limpa os arquivos obsoletos do
# repositorio e publica o resultado na main.
#
# Depois de usado, este arquivo e o scripts/decode_assets.py devem ser
# removidos do repositorio.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decodifica os arquivos binarios
        run: python3 scripts/decode_assets.py

      - name: Remove arquivos obsoletos
        run: |
          set -e
          git rm -q --ignore-unmatch -- \
            "favicon-sync.js" \
            "dino/sprite-2x.png" \
            "xmyguel-x.github.io-corrigido (1).zip"
          git rm -q -r --ignore-unmatch -- \
            "xmyguel-x.github.io-corrigido (1)" \
            "xmyguel-x.github.io-corrigido"

      - name: Confere que o site ficou inteiro
        run: python3 scripts/verify_site.py

      - name: Publica na main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publica a v1.1.0: binarios, documentacao e limpeza do repositorio"
          git push origin HEAD:main
